<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>벌툰 채팅 통계</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="/style.css" onerror="setTimeout(function(){location.reload()},3000)">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  [hidden] { display: none !important; }   /* style.css 가 못 와도 숨김 유지 */
  .page { max-width: 1100px; }
  .brand .store { font-weight: 600; opacity: .85; font-size: 14px; margin-left: 2px; padding-left: 8px; border-left: 1px solid rgba(255,255,255,.35); }

  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow); }
  .tile .k { font-size: 13px; color: var(--muted); font-weight: 600; }
  .tile .v { font-size: 30px; font-weight: 800; margin-top: 4px; letter-spacing: -0.5px; color: var(--brand); }
  .tile .v small { font-size: 13px; font-weight: 500; color: var(--muted); margin-left: 2px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } }
  .card h2 { font-size: 16px; margin: 0 0 12px; }
  .card h2 small { font-weight: 500; color: var(--muted); font-size: 13px; margin-left: 6px; }
  table { width: 100%; border-collapse: collapse; font-size: 15px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 600; font-size: 13px; }
  td.n, th.n { text-align: right; font-variant-numeric: tabular-nums; }
  /* 단일 계열 막대 (한 가지 색, 얇게, 끝 둥글게) */
  .hbar { display: flex; align-items: center; gap: 8px; }
  .hbar i { display: block; height: 10px; background: var(--accent); border-radius: 0 4px 4px 0; min-width: 2px; }
  .hbar b { font-weight: 500; font-size: 13px; font-variant-numeric: tabular-nums; }
  .cols { display: flex; align-items: flex-end; gap: 2px; height: 140px; border-bottom: 1px solid var(--line); padding-bottom: 0; position: relative; }
  .cols .c { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; height: 100%; position: relative; }
  .cols .c i { display: block; background: var(--accent); border-radius: 4px 4px 0 0; min-height: 0; }
  .cols .c:hover i { background: #1d4ed8; }
  .cols .c .tip { display: none; position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%); background: #111827; color: #fff; font-size: 12px; padding: 4px 8px; border-radius: 6px; white-space: nowrap; z-index: 2; }
  .cols .c:hover .tip { display: block; }
  .xlab { display: flex; gap: 2px; margin-top: 4px; }
  .xlab span { flex: 1; text-align: center; font-size: 11px; color: var(--muted); overflow: visible; white-space: nowrap; }
  .empty { color: var(--muted); font-size: 15px; padding: 12px 0; }
  .note { font-size: 13px; color: var(--muted); margin-top: 20px; line-height: 1.6; }
</style>
</head>
<body>
<header class="appbar">
  <a class="brand" href="/admin"><span class="mark">벌</span>벌툰 채팅</a>
  <span class="grow"></span>
  <nav class="tabs"><a href="/admin">채팅</a><a href="/admin/log">대화 기록</a><a href="/admin/stats" class="on">통계</a><a href="/admin/settings">설정</a><a href="/admin/qr" target="_blank">QR 인쇄</a></nav>
</header>
<main class="page">
<div class="toolbar">
  <h1>통계</h1>
  <select id="days">
    <option value="7">최근 7일</option>
    <option value="30" selected>최근 30일</option>
    <option value="90">최근 90일</option>
    <option value="365">최근 1년</option>
  </select>
</div>

<div class="tiles" id="tiles"></div>

<div class="grid">
  <div class="card"><h2>일별 손님 메시지 <small id="dayRange"></small></h2><div id="byDay"></div></div>
  <div class="card"><h2>시간대별 손님 메시지 <small>한국 시간</small></h2><div id="byHour"></div></div>
  <div class="card"><h2>방별 메시지 <small>손님 메시지 많은 순</small></h2><div id="byRoom"></div></div>
  <div class="card"><h2>많이 보낸 문구 <small>상위 10개</small></h2><div id="byText"></div></div>
</div>

<div class="card" style="margin-top:20px;border-color:#fecaca">
  <h2>기록 초기화</h2>
  <p style="font-size:14px;color:var(--muted);margin:0 0 10px">모든 방의 대화와 통계 기록을 삭제합니다. 테스트가 끝나고 실제 운영을 시작할 때 한 번 누르세요. 되돌릴 수 없습니다.</p>
  <button id="resetBtn" class="btn btn-danger">대화 + 통계 기록 전체 삭제</button>
  <span id="resetMsg" style="font-size:13px;margin-left:10px"></span>
</div>
<p class="note">손님 메시지 기준으로 집계합니다. "대화 비우기"를 해도 통계 기록은 남습니다. 응답 시간은 손님 메시지 뒤 같은 방에 직원이 처음 답장할 때까지의 시간이며, 2시간을 넘긴 경우는 평균에서 뺍니다.</p>
</main>

<script>
  // 매장 경로: 기본 매장은 '' , 추가 매장은 '/s/매장아이디'
  const BASE = location.pathname.replace(/\/admin(\/.*)?$/, '');
  document.querySelectorAll('a[href^="/admin"]').forEach((a) => a.setAttribute('href', BASE + a.getAttribute('href')));
  function showStoreName(store) { if (!store || !store.name) return; document.title = store.name + ' · ' + document.title; const b = document.querySelector('.brand'); if (b && !b.querySelector('.store')) { const t = document.createElement('span'); t.className = 'store'; t.textContent = store.name; b.appendChild(t); } }
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmtWait = (ms) => ms == null ? '-' : ms < 60000 ? Math.round(ms / 1000) + '<small>초</small>' : ms < 3600000 ? Math.round(ms / 60000) + '<small>분</small>' : (ms / 3600000).toFixed(1) + '<small>시간</small>';
  const fmtDT = (ts) => ts ? new Date(ts).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) : '-';

  function tile(k, v) { return `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div></div>`; }
  function hbars(items, label, max) {
    if (!items.length) return '<div class="empty">아직 기록이 없습니다.</div>';
    return `<table><tbody>${items.map((it) => `<tr><td style="width:40%">${label(it)}</td><td><div class="hbar"><i style="width:${Math.max(2, it.n / max * 100)}%"></i><b>${it.n}</b></div></td></tr>`).join('')}</tbody></table>`;
  }
  function cols(items, labelEvery, tipOf) {
    const max = Math.max(1, ...items.map((i) => i.n));
    return `<div class="cols">${items.map((it) => `<div class="c"><span class="tip">${tipOf(it)}</span><i style="height:${it.n / max * 100}%"></i></div>`).join('')}</div>
      <div class="xlab">${items.map((it, i) => `<span>${i % labelEvery === 0 ? it.label : ''}</span>`).join('')}</div>`;
  }

  async function load() {
    const days = $('days').value;
    const d = await (await fetch(BASE + '/admin/stats.json?days=' + days)).json();
    showStoreName(d.store);
    const t = d.totals;
    $('tiles').innerHTML =
      tile('오늘 손님 메시지', t.today) + tile('최근 7일', t.week) + (d.days !== 7 ? tile(`최근 ${d.days}일`, t.period) : '') + tile('전체 누적', t.all) +
      tile(`${d.days}일간 사용한 방`, t.activeRooms + '<small>/ ' + d.byRoom.length + '개</small>') +
      tile('자동 답변으로 해결', (t.auto || 0) + '<small>건</small>') + tile('평균 응답 시간', fmtWait(t.avgWait)) + tile('응답 시간 중간값', fmtWait(t.medWait)) + tile('답장 없는 요청', t.unanswered);
    $('dayRange').textContent = `최근 ${d.days}일`;
    // 눈금: 7일은 "11/22", 30일 이하는 날짜 숫자만(1,6,11…), 그 이상은 달이 바뀌는 날에 "11월"
    const dayItems = d.byDay.map((x) => {
      const [, m, dd] = x.day.split('-');
      const day = +dd;
      const label = d.days > 60 ? (day === 1 ? `${+m}월` : '')                       // 1년: 달이 바뀌는 날
        : d.days > 14 ? (day === 1 ? `${+m}/1` : [5, 10, 15, 20, 25].includes(day) ? String(day) : '')   // 30·90일: 1, 5, 10, 15…
        : `${+m}/${day}`;                                                            // 7일: 전부
      return { ...x, label };
    });
    const every = 1;
    $('byDay').innerHTML = cols(dayItems, every, (x) => `${x.day} · ${x.n}건`);
    $('byHour').innerHTML = cols(d.byHour.map((n, h) => ({ n, label: String(h) })), 3, (x) => `${x.label}시 · ${x.n}건`);
    const rooms = d.byRoom.filter((r) => r.guest > 0 || r.staff > 0);
    $('byRoom').innerHTML = rooms.length ? `<table><thead><tr><th>방</th><th class="n">손님</th><th class="n">직원</th><th>마지막</th></tr></thead><tbody>${rooms.map((r) => `<tr><td>${esc(r.name)}</td><td class="n">${r.guest}</td><td class="n">${r.staff}</td><td>${fmtDT(r.last)}</td></tr>`).join('')}</tbody></table>` : '<div class="empty">아직 기록이 없습니다.</div>';
    const maxT = Math.max(1, ...d.byText.map((x) => x.n));
    $('byText').innerHTML = hbars(d.byText, (x) => esc(x.text), maxT);
  }
  $('days').onchange = load;
  load();
  $('resetBtn').onclick = async () => {
    if (!confirm('모든 방의 대화와 통계 기록을 지울까요?\n되돌릴 수 없습니다.')) return;
    if (prompt('확인을 위해 "삭제"라고 입력하세요') !== '삭제') return;
    const r = await fetch(BASE + '/admin/reset', { method: 'POST' });
    $('resetMsg').textContent = r.ok ? '삭제됐습니다.' : '실패했습니다. 다시 시도해 주세요.';
    load();
  };
</script>
</body>
</html>
