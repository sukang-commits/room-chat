<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>벌툰 채팅 대화 기록</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  body { padding: 20px 16px 60px; max-width: 1000px; margin: 0 auto; }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; flex-wrap: wrap; }
  .bar h1 { font-size: 20px; margin: 0; flex: 1; }
  .filters { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .filters .preset { display: flex; gap: 6px; flex-wrap: wrap; }
  .filters .preset button { border: 1px solid var(--line); background: #fff; border-radius: 999px; padding: 6px 12px; font-size: 13px; }
  .filters .preset button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  .filters input, .filters select { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 14px; background: #fff; }
  .filters input[type=date] { width: 150px; }
  .filters input[type=search] { width: 180px; }
  .filters .go { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 9px 16px; font-weight: 700; font-size: 14px; }
  .filters .csv { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 14px; font-size: 14px; text-decoration: none; color: var(--text); }
  .summary { font-size: 14px; color: var(--muted); margin: 0 0 12px; }
  .summary b { color: var(--text); }
  .day { margin: 18px 0 8px; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .day::after { content: ""; flex: 1; height: 1px; background: var(--line); }
  .roomcard { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; margin-bottom: 10px; }
  .roomcard h3 { margin: 0 0 8px; font-size: 15px; display: flex; justify-content: space-between; }
  .roomcard h3 small { font-weight: 400; color: var(--muted); font-size: 12px; }
  .line { display: flex; gap: 10px; padding: 5px 0; font-size: 14px; border-bottom: 1px dashed #f1f5f9; align-items: flex-start; }
  .line:last-child { border-bottom: 0; }
  .line time { width: 44px; flex-shrink: 0; color: var(--muted); font-size: 12px; padding-top: 2px; font-variant-numeric: tabular-nums; }
  .line .who { width: 46px; flex-shrink: 0; font-size: 12px; font-weight: 700; padding-top: 2px; border-radius: 6px; text-align: center; }
  .line.guest .who { background: #dbeafe; color: #1d4ed8; }
  .line.staff .who { background: #dcfce7; color: #15803d; }
  .line.auto .who { background: #fef3c7; color: #b45309; }
  .line.system { color: var(--muted); font-size: 12px; }
  .line.system .who { background: #f3f4f6; color: var(--muted); }
  .line .text { flex: 1; white-space: pre-line; word-break: break-word; }
  .line .text img { display: block; max-width: 160px; border-radius: 8px; margin-top: 4px; }
  .line.hit .text { background: #fef9c3; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; font-size: 15px; }
  .warn { background: #fef3c7; color: #78350f; padding: 8px 12px; border-radius: 8px; font-size: 13px; margin-bottom: 10px; }
</style>
</head>
<body>
<div class="bar">
  <h1>대화 기록</h1>
  <a href="/admin">← 채팅으로</a>
</div>

<div class="filters">
  <div class="preset">
    <button data-days="0">오늘</button>
    <button data-days="1">어제</button>
    <button data-days="7">최근 7일</button>
    <button data-days="30">최근 30일</button>
  </div>
  <input type="date" id="from"> ~ <input type="date" id="to">
  <select id="room"><option value="">모든 방</option></select>
  <input type="search" id="q" placeholder="내용 검색">
  <button class="go" id="go">조회</button>
  <a class="csv" id="csv" href="#">엑셀로 내려받기</a>
</div>

<p class="summary" id="summary"></p>
<div id="warn" class="warn" hidden>기록이 너무 많아 최근 3,000건만 보여 줍니다. 기간을 줄이거나 방을 고르세요. 엑셀 내려받기는 전체가 담깁니다.</div>
<div id="out"></div>

<script>
  const $ = (id) => document.getElementById(id);
  const KST = 9 * 3600000;
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const ymd = (ts) => new Date(ts + KST).toISOString().slice(0, 10);
  const hm = (ts) => new Date(ts + KST).toISOString().slice(11, 16);
  const WHO = { guest: '손님', staff: '직원', auto: '자동', system: '퇴실' };
  const todayKST = () => ymd(Date.now());
  let roomsLoaded = false;
  const preRoom = new URLSearchParams(location.search).get('room') || '';   // /admin/log?room=22 로 열면 그 방만

  function setRange(days) {
    const end = Date.now();
    if (days === 1) { const y = ymd(end - 86400000); $('from').value = y; $('to').value = y; }
    else { $('from').value = ymd(end - days * 86400000); $('to').value = ymd(end); }
    document.querySelectorAll('.preset button').forEach((b) => b.classList.toggle('on', +b.dataset.days === days));
  }
  document.querySelectorAll('.preset button').forEach((b) => { b.onclick = () => { setRange(+b.dataset.days); load(); }; });
  ['from', 'to'].forEach((id) => { $(id).onchange = () => document.querySelectorAll('.preset button').forEach((b) => b.classList.remove('on')); });

  function params() {
    const p = new URLSearchParams();
    p.set('from', $('from').value || todayKST()); p.set('to', $('to').value || todayKST());
    const room = roomsLoaded ? $('room').value : preRoom;
    if (room) p.set('room', room);
    if ($('q').value.trim()) p.set('q', $('q').value.trim());
    return p.toString();
  }

  async function load() {
    const qs = params();
    $('csv').href = '/admin/log.csv?' + qs;
    const d = await (await fetch('/admin/log.json?' + qs)).json();
    if (!roomsLoaded) {
      Object.entries(d.roomNames).forEach(([id, name]) => { const o = document.createElement('option'); o.value = id; o.textContent = name; $('room').appendChild(o); });
      roomsLoaded = true;
      if (preRoom) $('room').value = preRoom;
    }
    $('warn').hidden = !d.truncated;
    const rows = d.rows;
    const guest = rows.filter((r) => r.from === 'guest').length, staff = rows.filter((r) => r.from === 'staff').length, auto = rows.filter((r) => r.from === 'auto').length;
    $('summary').innerHTML = `${$('from').value} ~ ${$('to').value}${d.room ? ' · ' + esc(d.roomNames[d.room]) : ''}${d.text ? ' · "' + esc(d.text) + '"' : ''} · 손님 <b>${guest}</b>건 · 직원 답장 <b>${staff}</b>건 · 자동 답변 <b>${auto}</b>건`;
    const out = $('out'); out.innerHTML = '';
    if (!rows.length) { out.innerHTML = '<div class="empty">이 조건에 맞는 기록이 없습니다.</div>'; return; }
    // 날짜 → 방 순으로 묶어서 대화처럼 보여줌 (최근 날짜가 위)
    const byDay = {};
    rows.forEach((r) => { const day = ymd(r.at); (byDay[day] = byDay[day] || {}); (byDay[day][r.room] = byDay[day][r.room] || []).push(r); });
    Object.keys(byDay).sort().reverse().forEach((day) => {
      const h = document.createElement('div'); h.className = 'day'; h.textContent = day.replace(/-/g, '.') + ' (' + ['일', '월', '화', '수', '목', '금', '토'][new Date(day).getDay()] + ')'; out.appendChild(h);
      Object.keys(byDay[day]).sort((a, b) => Number(a) - Number(b)).forEach((room) => {
        const list = byDay[day][room].sort((a, b) => a.at - b.at);
        const card = document.createElement('div'); card.className = 'roomcard';
        card.innerHTML = `<h3><span>${esc(d.roomNames[room] || room + '번방')}</span><small>${list.filter((r) => r.from === 'guest').length}건 요청</small></h3>` +
          list.map((r) => `<div class="line ${r.from}${d.text && String(r.text).toLowerCase().includes(d.text) ? ' hit' : ''}"><time>${hm(r.at)}</time><span class="who">${WHO[r.from] || r.from}</span><span class="text">${esc(r.text)}${r.image ? `<a href="${esc(r.image)}" target="_blank"><img src="${esc(r.image)}" alt=""></a>` : ''}</span></div>`).join('');
        out.appendChild(card);
      });
    });
  }
  $('go').onclick = load;
  $('q').onkeydown = (e) => { if (e.key === 'Enter') load(); };
  $('room').onchange = load;
  setRange(7);
  load();
</script>
</body>
</html>
