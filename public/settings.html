<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>벌툰 채팅 설정</title>
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<style>
  body { padding: 20px 16px 60px; max-width: 860px; margin: 0 auto; }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .bar h1 { font-size: 20px; margin: 0; flex: 1; }
  h2 { font-size: 16px; margin: 28px 0 8px; }
  .help { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 0 0 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; }
  .card.off { opacity: .75; }
  .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .row + .row { margin-top: 10px; }
  label.k { font-size: 12px; color: var(--muted); width: 100%; }
  input[type=text], textarea { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; font-size: 15px; outline: none; }
  input[type=text]:focus, textarea:focus { border-color: var(--accent); }
  textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
  .label-in { flex: 1; min-width: 180px; }
  .toggle { display: flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; white-space: nowrap; }
  .toggle input { width: 18px; height: 18px; }
  .btns { display: flex; gap: 6px; margin-left: auto; }
  .btns button { border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 6px 10px; font-size: 13px; }
  .btns button.del { color: #b91c1c; }
  .img { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .img img { width: 120px; height: 90px; object-fit: cover; border-radius: 8px; border: 1px solid var(--line); }
  .img .none { width: 120px; height: 90px; border-radius: 8px; border: 1px dashed var(--line); display: flex; align-items: center; justify-content: center; font-size: 12px; color: var(--muted); }
  .file { display: inline-block; border: 1px solid var(--line); background: #fff; border-radius: 8px; padding: 8px 12px; font-size: 13px; cursor: pointer; }
  .file input { display: none; }
  .preview { background: #fffbeb; border: 1px solid #fde68a; border-radius: 14px; padding: 10px 12px; font-size: 14px; white-space: pre-line; max-width: 320px; }
  .preview .tag { display: block; font-size: 11px; font-weight: 700; color: #b45309; margin-bottom: 3px; }
  .preview img { display: block; max-width: 100%; border-radius: 8px; margin-top: 8px; }
  .variants { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 10px; }
  .variants > .k { display: block; font-size: 13px; font-weight: 700; margin-bottom: 4px; }
  .variants .hint { font-size: 12px; color: var(--muted); margin: 0 0 8px; line-height: 1.5; }
  .variant { background: #f8fafc; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .variant .rooms-in { width: 220px; max-width: 100%; }
  .variant .count { font-size: 12px; color: var(--muted); }
  .variant .count.bad { color: #b91c1c; }
  .addv { border: 1px dashed var(--line); background: #fff; border-radius: 8px; padding: 8px 12px; font-size: 13px; color: var(--muted); }
  .add { border: 1px dashed var(--line); background: transparent; border-radius: 12px; padding: 12px; width: 100%; font-size: 14px; color: var(--muted); }
  .save { position: fixed; left: 0; right: 0; bottom: 0; background: #fff; border-top: 1px solid var(--line); padding: 12px 16px; display: flex; gap: 12px; align-items: center; justify-content: center; }
  .save button { background: var(--accent); color: #fff; border: 0; border-radius: 10px; padding: 12px 28px; font-size: 16px; font-weight: 700; }
  .save .msg { font-size: 14px; }
  .save .msg.ok { color: #15803d; } .save .msg.err { color: #b91c1c; }
</style>
</head>
<body>
<div class="bar">
  <h1>벌툰 채팅 설정</h1>
  <a href="/admin">← 채팅으로</a>
</div>

<h2>손님 빠른 버튼과 자동 답변</h2>
<p class="help">
  손님 화면에 나오는 버튼입니다. <b>자동 답변을 켜면</b> 손님이 그 버튼을 누르거나 키워드가 들어간 글을 보냈을 때, 직원이 보기 전에 아래 내용이 손님에게 바로 뜹니다.
  직원 화면에는 평소처럼 알림이 갑니다. 와이파이 이름과 비밀번호, OTT 리모컨 순서 같은 걸 적어 두면 절반은 손님이 스스로 해결합니다. 사진도 한 장 붙일 수 있습니다.
</p>
<div id="buttons"></div>
<button class="add" id="addBtn">+ 버튼 추가</button>

<h2>직원 빠른 답장</h2>
<p class="help">직원 채팅창 아래 버튼입니다. 한 줄에 하나씩, 최대 12개.</p>
<div class="card"><textarea id="staffReplies" placeholder="바로 가겠습니다"></textarea></div>

<div class="save">
  <button id="saveBtn">저장</button>
  <span class="msg" id="saveMsg"></span>
</div>

<script>
  const $ = (id) => document.getElementById(id);
  let data = { guestButtons: [], staffReplies: [] };
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  function render() {
    const wrap = $('buttons');
    wrap.innerHTML = '';
    data.guestButtons.forEach((b, i) => {
      const card = document.createElement('div');
      card.className = 'card' + (b.on ? '' : ' off');
      const imgSrc = b.imageData || b.image || '';
      card.innerHTML = `
        <div class="row">
          <input type="text" class="label-in" data-k="label" value="${esc(b.label)}" placeholder="버튼 문구 (예: 와이파이가 안돼요)" maxlength="30">
          <label class="toggle"><input type="checkbox" data-k="on" ${b.on ? 'checked' : ''}> 자동 답변 켜기</label>
          <div class="btns">
            <button type="button" data-act="up" ${i === 0 ? 'disabled' : ''}>▲</button>
            <button type="button" data-act="down" ${i === data.guestButtons.length - 1 ? 'disabled' : ''}>▼</button>
            <button type="button" class="del" data-act="del">삭제</button>
          </div>
        </div>
        <div class="row">
          <label class="k">자동 답변 내용 (손님에게 바로 보일 글. 비워 두면 안 나감)</label>
          <textarea data-k="reply" placeholder="예) 와이파이 이름: 벌툰 / 비밀번호: 12345678">${esc(b.reply)}</textarea>
        </div>
        <div class="row">
          <label class="k">같이 보낼 사진 (선택. 리모컨 사진, 사용 순서 캡처 등)</label>
          <div class="img">
            ${imgSrc ? `<img src="${esc(imgSrc)}" alt="">` : '<div class="none">사진 없음</div>'}
            <label class="file">사진 선택<input type="file" accept="image/*" data-act="img"></label>
            ${imgSrc ? '<button type="button" class="btns-del" data-act="imgdel" style="border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:13px;color:#b91c1c">사진 삭제</button>' : ''}
          </div>
        </div>
        <div class="row">
          <label class="k">키워드 (손님이 직접 타자로 쳐도 이 단어가 들어 있으면 자동 답변. 쉼표로 구분)</label>
          <input type="text" data-k="keywords" value="${esc((b.keywords || []).join(', '))}" placeholder="예) 와이파이, wifi, 비밀번호">
        </div>
        ${b.on && (b.reply || '').trim() ? `<div class="row"><label class="k">손님 화면 미리보기 (기본)</label><div class="preview"><span class="tag">💡 자동 안내</span>${esc(b.reply.trim())}${imgSrc ? `<img src="${esc(imgSrc)}" alt="">` : ''}</div></div>` : ''}
        <div class="variants">
          <span class="k">방마다 다르게 보내기</span>
          <p class="hint">방 종류가 다르면 묶음을 추가하세요. 예: 빔프로젝터 방은 "1-10, 15", TV 방은 "11-14, 16-40". 묶음에 없는 방은 위의 기본 내용이 나갑니다. 글을 비우면 기본 글에 사진만 바꿔 보낼 수도 있습니다.</p>
          <div class="vlist"></div>
          <button type="button" class="addv">+ 방 묶음 추가</button>
        </div>`;
      renderVariants(card, b);
      // 입력 반영
      // 기본 칸의 입력 처리 (묶음 안의 칸은 renderVariants가 따로 처리)
      [...card.querySelectorAll('[data-k]')].filter((el) => !el.closest('.variant')).forEach((el) => {
        el.oninput = el.onchange = () => {
          const k = el.dataset.k;
          if (k === 'on') { b.on = el.checked; render(); }
          else if (k === 'keywords') b.keywords = el.value.split(',').map((x) => x.trim()).filter(Boolean);
          else b[k] = el.value;
          if (k === 'reply') { const pv = card.querySelector('.preview'); if (pv) pv.childNodes[1].textContent = el.value.trim(); }
        };
      });
      [...card.querySelectorAll('[data-act]')].filter((el) => !el.closest('.variant')).forEach((el) => {
        const act = el.dataset.act;
        if (act === 'up') el.onclick = () => { [data.guestButtons[i - 1], data.guestButtons[i]] = [data.guestButtons[i], data.guestButtons[i - 1]]; render(); };
        if (act === 'down') el.onclick = () => { [data.guestButtons[i + 1], data.guestButtons[i]] = [data.guestButtons[i], data.guestButtons[i + 1]]; render(); };
        if (act === 'del') el.onclick = () => { if (confirm(`"${b.label}" 버튼을 지울까요?`)) { data.guestButtons.splice(i, 1); render(); } };
        if (act === 'imgdel') el.onclick = () => { b.image = ''; b.imageData = ''; render(); };
        if (act === 'img') el.onchange = () => { const f = el.files[0]; if (f) shrink(f).then((d) => { b.imageData = d; render(); }); };
      });
      wrap.appendChild(card);
    });
  }

  // "1-10, 15" -> 방 id 목록 (화면 안내용. 실제 검사는 서버가 다시 함)
  function parseRooms(spec) {
    const ids = new Set();
    String(spec || '').split(/[,\s]+/).filter(Boolean).forEach((tok) => {
      const m = /^(\d+)(?:-(\d+))?$/.exec(tok); if (!m) return;
      const a = +m[1], c = m[2] ? +m[2] : a;
      for (let i = Math.min(a, c); i <= Math.max(a, c) && i <= 500; i++) if (i >= 1 && i <= (data.roomCount || 0)) ids.add(i);
    });
    return [...ids].sort((x, y) => x - y);
  }
  function renderVariants(card, b) {
    const list = card.querySelector('.vlist');
    list.innerHTML = '';
    b.variants = b.variants || [];
    b.variants.forEach((v, j) => {
      const vs = v.imageData || v.image || '';
      const ids = parseRooms(v.rooms);
      const el = document.createElement('div');
      el.className = 'variant';
      el.innerHTML = `
        <div class="row">
          <input type="text" class="rooms-in" data-k="rooms" value="${esc(v.rooms)}" placeholder="방 번호 (예: 1-10, 15, 22)">
          <span class="count ${ids.length ? '' : 'bad'}">${ids.length ? ids.length + '개 방: ' + ids.join(', ') : '방 번호를 입력하세요'}</span>
          <div class="btns"><button type="button" class="del" data-act="vdel">묶음 삭제</button></div>
        </div>
        <div class="row">
          <label class="k">이 방들에 보낼 글 (비우면 기본 글)</label>
          <textarea data-k="reply" placeholder="이 방들만 다른 안내">${esc(v.reply)}</textarea>
        </div>
        <div class="row">
          <label class="k">이 방들에 보낼 사진 (비우면 기본 사진)</label>
          <div class="img">
            ${vs ? `<img src="${esc(vs)}" alt="">` : '<div class="none">사진 없음</div>'}
            <label class="file">사진 선택<input type="file" accept="image/*" data-act="vimg"></label>
            ${vs ? '<button type="button" data-act="vimgdel" style="border:1px solid var(--line);background:#fff;border-radius:8px;padding:8px 12px;font-size:13px;color:#b91c1c">사진 삭제</button>' : ''}
          </div>
        </div>`;
      el.querySelectorAll('[data-k]').forEach((inp) => {
        inp.oninput = () => {
          v[inp.dataset.k] = inp.value;
          if (inp.dataset.k === 'rooms') { const c = parseRooms(inp.value); const sp = el.querySelector('.count'); sp.className = 'count ' + (c.length ? '' : 'bad'); sp.textContent = c.length ? c.length + '개 방: ' + c.join(', ') : '방 번호를 입력하세요'; }
        };
      });
      el.querySelector('[data-act=vdel]').onclick = () => { if (confirm('이 방 묶음을 지울까요?')) { b.variants.splice(j, 1); renderVariants(card, b); } };
      el.querySelector('[data-act=vimg]').onchange = (e) => { const f = e.target.files[0]; if (f) shrink(f).then((d) => { v.imageData = d; renderVariants(card, b); }); };
      const vd = el.querySelector('[data-act=vimgdel]'); if (vd) vd.onclick = () => { v.image = ''; v.imageData = ''; renderVariants(card, b); };
      list.appendChild(el);
    });
    card.querySelector('.addv').onclick = () => { b.variants.push({ id: 'v' + Math.random().toString(36).slice(2, 8), rooms: '', reply: '', image: '' }); renderVariants(card, b); };
  }

  // 사진을 긴 쪽 1200px 이하 JPEG로 줄여서 올림 (용량 절약)
  function shrink(file) {
    return new Promise((resolve) => {
      const img = new Image();
      img.onload = () => {
        const max = 1200, r = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.round(img.width * r); c.height = Math.round(img.height * r);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        resolve(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = URL.createObjectURL(file);
    });
  }

  $('addBtn').onclick = () => { data.guestButtons.push({ id: 'b' + Math.random().toString(36).slice(2, 8), label: '', on: false, reply: '', image: '', keywords: [] }); render(); window.scrollTo(0, document.body.scrollHeight); };

  $('saveBtn').onclick = async () => {
    const msg = $('saveMsg'); msg.className = 'msg'; msg.textContent = '저장 중…';
    const payload = { guestButtons: data.guestButtons, staffReplies: $('staffReplies').value.split('\n') };
    const r = await fetch('/admin/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
    const j = await r.json();
    if (!r.ok) { msg.className = 'msg err'; msg.textContent = j.error || '저장 실패'; return; }
    data = j; $('staffReplies').value = data.staffReplies.join('\n'); render();
    msg.className = 'msg ok'; msg.textContent = '저장됐습니다. 손님·직원 화면에 바로 적용됩니다.';
  };

  fetch('/admin/settings.json').then((r) => r.json()).then((j) => { data = j; $('staffReplies').value = data.staffReplies.join('\n'); render(); });
</script>
</body>
</html>
