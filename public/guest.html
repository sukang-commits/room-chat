<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>벌툰 채팅</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  body { height: 100dvh; }
  .chat-header .dot { width: 9px; height: 9px; border-radius: 50%; background: #9ca3af; }
  .chat-header .dot.on { background: #22c55e; }
</style>
</head>
<body>
<div class="chat">
  <header class="chat-header">
    <div>
      <h1 id="roomName">연결 중…</h1>
      <div class="sub"><span class="dot" id="dot"></span> 벌툰 · 불편하신 점을 남겨 주시면 직원이 바로 확인합니다</div>
    </div>
  </header>

  <main class="messages" id="messages">
    <div class="empty" id="empty">아직 대화가 없습니다.<br>아래 버튼을 누르거나 메시지를 입력해 주세요.</div>
  </main>

  <div class="quick" id="quick"></div>

  <form class="composer" id="form">
    <input id="input" placeholder="메시지를 입력하세요" autocomplete="off" maxlength="500">
    <button type="submit" id="send">전송</button>
  </form>
</div>

<script src="/socket.io/socket.io.js"></script>
<script>
  const roomId = location.pathname.split('/').pop();
  const QUICK = ['추워요 🥶', '더워요 🥵', '시끄러워요 🔇', 'OTT 어떻게 해요? 📺', '와이파이가 안돼요'];

  const $msgs = document.getElementById('messages');
  const $empty = document.getElementById('empty');
  const $form = document.getElementById('form');
  const $input = document.getElementById('input');
  const $dot = document.getElementById('dot');
  const $quick = document.getElementById('quick');
  const $send = document.getElementById('send');

  QUICK.forEach((t) => {
    const b = document.createElement('button');
    b.type = 'button'; b.textContent = t;
    b.onclick = () => send(t);
    $quick.appendChild(b);
  });

  const fmt = (ts) => new Date(ts).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit' });
  function render(m) {
    $empty.style.display = 'none';
    const div = document.createElement('div');
    div.className = 'msg ' + (m.from === 'guest' ? 'me' : 'them');
    div.innerHTML = `<span class="text"></span><span class="time">${m.from === 'staff' ? '직원 · ' : ''}${fmt(m.at)}</span>`;
    div.querySelector('.text').textContent = m.text;
    $msgs.appendChild(div);
    $msgs.scrollTop = $msgs.scrollHeight;
  }

  const socket = io();
  socket.on('connect', () => {
    $dot.classList.add('on');
    socket.emit('guest:join', { room: roomId }, (res) => {
      if (res.error) { document.getElementById('roomName').textContent = res.error; return; }
      document.getElementById('roomName').textContent = res.room.name + ' 손님';
      document.title = res.room.name + ' 채팅';
      $msgs.querySelectorAll('.msg').forEach((e) => e.remove());
      $empty.style.display = res.messages.length ? 'none' : '';
      res.messages.forEach(render);
    });
  });
  socket.on('disconnect', () => $dot.classList.remove('on'));
  socket.on('message', render);
  socket.on('cleared', () => { $msgs.querySelectorAll('.msg').forEach((e) => e.remove()); $empty.style.display = ''; });

  function send(text) {
    text = text.trim();
    if (!text || !socket.connected) return;
    $send.disabled = true;
    socket.emit('guest:message', { text }, () => { $send.disabled = false; });
    $input.value = '';
  }
  $form.addEventListener('submit', (e) => { e.preventDefault(); send($input.value); $input.focus(); });
</script>
</body>
</html>
