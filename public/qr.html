<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>방별 QR 인쇄</title>
<link rel="stylesheet" href="/style.css">
<style>
  body { padding: 24px; }
  .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  .bar h1 { font-size: 20px; margin: 0; flex: 1; }
  .bar button { background: var(--accent); color: #fff; border: 0; border-radius: 8px; padding: 10px 16px; font-weight: 600; }
  .bar .url { font-size: 13px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
  .card { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 22px 18px; text-align: center; break-inside: avoid; page-break-inside: avoid; }
  .card h2 { margin: 0 0 4px; font-size: 28px; }
  .card p { margin: 0 0 12px; color: var(--muted); font-size: 14px; }
  .card img { width: 100%; max-width: 220px; display: block; margin: 0 auto 10px; }
  .card .link { font-size: 11px; color: var(--muted); word-break: break-all; }
  @media print {
    body { background: #fff; padding: 0; }
    .bar { display: none; }
    .grid { grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .card { border: 1px dashed #999; border-radius: 0; }
  }
</style>
</head>
<body>
<div class="bar">
  <h1>방별 QR 코드</h1>
  <span class="url" id="base"></span>
  <button onclick="window.print()">인쇄하기</button>
</div>
<div class="grid" id="grid"></div>
<script>
  fetch('/admin/config').then((r) => r.json()).then(({ rooms, baseUrl }) => {
    document.getElementById('base').textContent = 'QR 주소: ' + baseUrl + '/r/…';
    document.getElementById('grid').innerHTML = rooms.map((r) => `
      <div class="card">
        <h2>${r.name}</h2>
        <p>QR을 찍으면 직원에게 바로 채팅할 수 있어요</p>
        <img src="/api/qr/${r.id}.png" alt="${r.name} QR">
        <div class="link">${baseUrl}/r/${r.id}</div>
      </div>`).join('');
  });
</script>
</body>
</html>
